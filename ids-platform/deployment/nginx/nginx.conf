# nginx reverse proxy configuration for the SOC platform.
# - TLS termination (self-signed certs in /etc/nginx/ssl, generated by nginx.Dockerfile)
# - rate limiting: 100 r/s API, 20 r/s WebSocket
# - security headers
# - sensitive-path blocking (.env, .git, node_modules, venv)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- rate limiting zones (per client IP) ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=20r/s;

    # ---- security headers shared across server blocks ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- block access to sensitive paths ----
    location ~* \.(env|git|log)$ { deny all; }
    location ~ ^/\. { deny all; }
    location ~ (^|/)(node_modules|venv|__pycache__)/ { deny all; }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # ---- SPA fallback ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- API proxy (rate limited) ----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ---- WebSocket proxy (rate limited) ----
        location /ws/ {
            limit_req zone=ws_limit burst=5 nodelay;
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }
    }
}
