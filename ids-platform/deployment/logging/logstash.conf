input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if [type] == "backend" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  if [type] == "nginx" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "soc-logs-%{+YYYY.MM.dd}"
  }
}
