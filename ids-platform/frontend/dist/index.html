<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SOC Dashboard</title>
    <script>
      // Apply the stored theme before first paint so the dashboard never
      // flashes the wrong theme (default dark; index.css holds the vars).
      try {
        var saved = localStorage.getItem("soc-dashboard-theme");
        if (saved === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-NeKcvCtW.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C_osebcI.css">
  </head>
  <body class="bg-surface text-slate-100 font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
